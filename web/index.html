const corpusCopyText = new WeakMap();
const corpusCatalogs = new Map();
const corpusPoetryPages = new Map();
function corpusVolumeLabel(unit) {
  const name = String(unit.juan ?? '');
  if (/^KR[0-9A-Za-z]+_\d+(?:\.txt)?$/.test(name)) return '卷次待核';
  const match = /^(?:卷|巻)?0*(\d+)([上下中之一二三四五六七八九十]*)$/.exec(name);
  if (match) return Number(match[1]) > 0 ? `卷${Number(match[1])}${match[2]}` : '卷次待核';
  return name || unit.title || '卷次待核';
}
function corpusReadingHeading(unit) {
  const label = corpusVolumeLabel(unit);
  let title = String(unit.title || '').trim();
  const book = String(unit.book || '').trim();
  if (book && title.startsWith(book)) title = title.slice(book.length).replace(/^[\s·：:]+/, '');
  return !title || corpusVolumeLabel({juan:title}) === label ? label : `${label} · ${title}`;
}
const corpusReadingPrefs = { script:'simplified', notes:false, size:20 };
let currentCorpusUnit = null;
let currentStudyParagraph = null;
try {
  const saved = JSON.parse(localStorage.getItem('corpus-reading') || '{}');
  if (['simplified','original','raw'].includes(saved.script)) corpusReadingPrefs.script = saved.script;
  if (typeof saved.notes === 'boolean') corpusReadingPrefs.notes = saved.notes;
  if ([18,20,22,24,26].includes(saved.size)) corpusReadingPrefs.size = saved.size;
} catch (_) { /* Storage is optional. */ }
function corpusSourceNote(provenance) {
  if (!provenance) return '';
  const source = provenance.source || {};
  const valid = /^[\w-]+\/[\w.-]+$/.test(source.repository || '') && /^[a-f0-9]{40}$/.test(source.commit || '');
  const link = valid ? `<a class="tag acc" href="https://github.com/${esc(source.repository)}/tree/${esc(source.commit)}" target="_blank" rel="noopener noreferrer">查看固定来源 ↗</a>` : '';
  const revisions = (source.revisions || []).filter(r => Number.isSafeInteger(r.revid) && r.revid > 0);
  return `<div class="note"><div class="k">转录待校 · 收录范围</div>
    ${esc(provenance.reviewStatus || '')}
    <div class="src">本批收录：${esc(provenance.coverage?.included || '')}。${esc(provenance.coverage?.reason || '')}</div>
    ${provenance.counts?.emptySourcePages ? `<div class="src">本批有 ${esc(provenance.counts.emptySourcePages)} 个电子页标未附转录文字，是否原书空白待核。</div>` : ''}
    ${provenance.counts?.unresolvedGlyphTokenOccurrences ? `<div class="src">本批保留 ${esc(provenance.counts.unresolvedGlyphTokenOccurrences)} 处原录缺字标记（&amp;KR…;），尚未释读。</div>` : ''}
    <div class="src">${esc(provenance.attribution || '')} · ${esc(provenance.license || '')}</div>
    ${source.baseEdition ? `<div class="src">底本：${esc(source.baseEdition)}</div>` : ''}
    ${revisions.map(r => `<a class="tag acc" href="https://zh.wikisource.org/w/index.php?oldid=${r.revid}" target="_blank" rel="noopener noreferrer">${esc(r.title)} · 修订 ${r.revid} ↗</a>`).join(' ')}${link}</div>`;
}

async function openJuan(id) {
  const el = $('#reader');
  el.innerHTML = '<p class="empty">载入中…</p>';
  const response = await fetch(`/api/texts/juan/${id}`);
  if (!response.ok) { $('.main').classList.remove('reading-active'); el.innerHTML = '<p class="empty">这卷暂时无法读取，请稍后重试。</p>'; return; }
  const j = await response.json();
  currentCorpusUnit = j;
  currentStudyParagraph = null;
  $('.main').classList.add('reading-active');
  renderCorpusReading(j);
  el.scrollTop = 0;
  if (matchMedia('(max-width:900px)').matches) el.scrollIntoView({block:'start'});
}

function renderCorpusReading(j) {
  const el = $('#reader');
  const pages = j.paragraphs || [];
  const catalog = corpusCatalogs.get(String(j.book_id)) || [];
  const currentIndex = catalog.findIndex(u => u.id === j.id);
  const prev = catalog[currentIndex - 1], next = currentIndex >= 0 ? catalog[currentIndex + 1] : null;
  const located = !!j.origin;
  const simplified = !!j.reading?.simplifiedAvailable;
  const script = corpusReadingPrefs.script === 'simplified' && !simplified ? 'original' : corpusReadingPrefs.script;
  const readingPages = j.reading?.pages || [{seq:1,segments:[{kind:'text',original:j.body || '',simplified:null}]}];
  const hasNotes = readingPages.some(p => p.segments.some(s => s.kind === 'parenthetical'));
  const wikiNotes = readingPages.some(p => p.segments.some(s => s.noteKind === 'wiki-editorial-note'));
  const sourcePages = pages.some(p => p.origin?.segmentation === 'source-page');
  const value = s => (script === 'simplified' ? (s.simplified ?? s.original) : s.original).replace(/&KR[0-9A-Za-z]+;/g, '□');
  const segmentHtml = s => esc(script === 'simplified' ? (s.simplified ?? s.original) : s.original).replace(/&amp;KR[0-9A-Za-z]+;/g, marker => `<span class="corpus-missing" title="原录未释字标记：${marker}">□</span>`);
  const plain = script === 'raw' ? (j.body || '') : readingPages.map(p => p.segments.filter(s => corpusReadingPrefs.notes || s.kind !== 'parenthetical').map(value).join('')).join('\n\n');
  const body = script === 'raw' ? `<div class="corpus-original">${esc(j.body || '')}</div>` : readingPages.map(p => {
    const content = p.segments.length ? p.segments.map(s => `<span${s.kind === 'parenthetical' ? ' class="corpus-parenthetical"' : ''}>${segmentHtml(s)}</span>`).join('') : '<span class="corpus-empty-page">此电子页暂无转录文字，待核。</span>';
    const tag = p.headingLevel >= 3 ? 'h4' : 'h3';
    return p.kind === 'heading' ? `<${tag} class="corpus-heading" data-source-level="${esc(p.headingLevel || '')}" id="corpus-page-${p.seq}">${content}</${tag}>` : `<div class="corpus-page${currentStudyParagraph === p.paragraphId ? ' is-current' : ''}" id="corpus-page-${p.seq}" data-paragraph-id="${esc(p.paragraphId || '')}">${content}${p.paragraphId ? `<button class="corpus-paragraph-button" data-study-paragraph="${p.paragraphId}" aria-label="查看第 ${p.seq} 段译注">译注</button>` : ''}</div>`;
  }).join('');
  const status = [located ? '转录待校' : '来源转录', j.punctuated ? '已有标点' : '未标点', script === 'simplified' ? '简体为机器转换' : script === 'raw' ? '原录字形与换行' : '原字阅读排版'];
  if (j.preview === true) status.unshift('解析预览·未写入正式库');
  if (j.origin?.metadata?.emptySourcePageLabels?.length) status.push(`${j.origin.metadata.emptySourcePageLabels.length}个空电子页待核`);
  if (j.origin?.metadata?.unresolvedGlyphTokens?.length) status.push(script === 'raw' ? '含未释字标记' : '未释字以□显示');
  if (j.origin?.metadata?.kind === 'edition-examination') status.push('本版考证');
  if (script !== 'raw') status.push('阅读排版');
  const heading = corpusReadingHeading(j) || '';
  const bookName = j.book || '';
  const relatedWorks = (IDX.works || []).filter(w => {
    if (!bookName) return false;
    const cleanTitle = w.titleZh.replace(/[\s·]/g, '');
    const cleanBook = bookName.replace(/[\s·]/g, '');
    const cleanHeading = heading.replace(/[\s·]/g, '');
    const inTitle = cleanTitle.includes(cleanBook) && cleanHeading && cleanTitle.includes(cleanHeading);
    const inAliases = (w.aliases || []).some(a => a.includes(cleanBook) && (!cleanHeading || a.includes(cleanHeading)));
    const inCitation = w.citation && w.citation.includes(cleanBook) && cleanHeading && w.citation.includes(cleanHeading);
    return inTitle || inAliases || inCitation;
  });

  el.innerHTML = `<div class="corpus-navigation">
      <button data-corpus-book="${esc(j.book_id || '')}">返回卷目</button>
      ${prev ? `<button data-juan="${prev.id}" title="${esc(corpusVolumeLabel(prev))}">上一篇</button>` : ''}
      ${catalog.length ? `<select data-corpus-select aria-label="切换卷篇">${catalog.map(u => `<option value="${u.id}"${u.id === j.id ? ' selected' : ''}>${esc(corpusVolumeLabel(u))}</option>`).join('')}</select>` : ''}
      ${next ? `<button data-juan="${next.id}" title="${esc(corpusVolumeLabel(next))}">下一篇</button>` : ''}
    </div><header class="corpus-title"><div class="work-eyebrow">典籍 · 卷篇阅读</div><h2 class="rt">${esc(j.book || '')} · ${esc(heading)}</h2>
    <div class="corpus-status">${status.map(esc).join(' · ')}</div></header>
    ${relatedWorks.length ? `
    <div class="note" style="margin:12px 0 16px;background:var(--bg-soft);border:1px solid var(--accent);border-radius:6px;padding:10px 14px">
      <div style="font-weight:600;font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:6px">
        <span>📌 本卷篇目已有精选研读与行迹考证</span>
      </div>
      <p style="margin:4px 0 8px;font-size:13px;line-height:1.6;color:var(--ink)">
        当前卷篇在江山行止中已整理详细大意、注释、校记与地理行迹：
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${relatedWorks.map(rw => `<a class="tag acc" href="#/work/${encodeURIComponent(rw.key)}" data-work="${esc(rw.key)}">${esc(rw.titleZh)} · 研读与行迹 ↗</a>`).join('')}
      </div>
    </div>` : ''}
    ${j.origin?.metadata?.boundaryNote ? '<div class="corpus-status">原录组件边界待核，详见下方出处说明。</div>' : ''}
    <div class="corpus-controls" role="group" aria-label="阅读方式">
      ${[['simplified','简体阅读'],['original','原字阅读'],['raw','原录']].map(([v,l]) => `<button data-corpus-script="${v}" aria-pressed="${script === v}"${v === 'simplified' && !simplified ? ' disabled' : ''}>${l}</button>`).join('')}
      <button data-corpus-notes aria-pressed="${corpusReadingPrefs.notes}"${!hasNotes || script === 'raw' ? ' disabled' : ''}>${corpusReadingPrefs.notes ? '收起' : '显示'}${wikiNotes ? '编者注' : '夹注'}</button>
      <span class="size-control"><button data-corpus-size="-2" aria-label="缩小字号">A−</button><button data-corpus-size="2" aria-label="增大字号">A＋</button></span>
    </div>
    ${hasNotes && !corpusReadingPrefs.notes && script !== 'raw' ? `<div class="corpus-status">${wikiNotes ? '维基编者注独立保存，注者待核；可展开阅读，不视为古人评点。' : '已收起原录括号内文字，可随时展开。'}</div>` : ''}
    <div class="corpus-reading-layout"><div class="corpus-prose${corpusReadingPrefs.notes ? '' : ' hide-notes'}" style="font-size:${corpusReadingPrefs.size}px">${body}</div><aside class="corpus-study" aria-live="polite" aria-label="段落译注"><div class="corpus-study-kicker">研读 · 译注</div><h3>与原文同行</h3><p>选中一句或点击段旁“译注”，查看所在段落的译文与注释。</p><small>译注尚未整理的段落会显示“待补”。</small></aside></div>
    <div class="reader-tools"><button data-copy-reading>复制当前文字</button><button data-copyraw="1" data-copy-label="复制原录">复制原录</button><button data-print="1">打印</button></div>
    <details class="corpus-provenance"><summary>版本、出处与原录说明</summary>
      <p class="src">原目录标识：${esc(j.juan || '未记录')}</p>
      <p>${esc(j.edition || '版本信息待核')}。${pages.length} ${sourcePages ? '个来源页单元，非原书自然段' : '个来源段落/标题单元'}。${j.punctuated ? '沿用来源已有标点。' : '来源没有标点，当前未代加断句。'}</p>
      ${/^https?:\/\//.test(j.source_url || '') ? `<a class="tag" href="${esc(j.source_url)}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a>` : ''}
      ${corpusSourceNote(j.origin?.provenance)}
      ${j.origin?.metadata?.boundaryNote ? `<p>${esc(j.origin.metadata.boundaryNote)}</p>` : ''}
      <p>简体使用 ${esc(j.reading?.conversion?.engine || '未配置')} ${esc(j.reading?.conversion?.version || '')} 转换，供阅读；引用请核对原录。${wikiNotes ? '原录为保留来源标点的正文纯文本；维基编者注单独保存并标注，原始维基标记与编辑历史可由固定修订复查。' : '阅读排版接续来源页硬换行，夹注中的双行斜线标记不在阅读版显示。括号分组不代表注者归属已经核定。'}</p>
      ${sourcePages ? `<details><summary>来源页定位与空页状态</summary>
      <p class="src">以下为电子文本页标，尚未逐页核对影像叶码。括号及其中原录文字保留，古注归属尚待核。</p>
      <ol>${pages.map(p => `<li><a href="#corpus-page-${p.seq}">${esc(p.origin?.pageLabel || String(p.seq))}</a>${p.origin?.emptyTranscription ? ' · 此页未转录文字，是否原书空白待核' : ''}</li>`).join('')}</ol></details>` : ''}
    </details>`;
  corpusCopyText.set(el.querySelector('[data-copyraw]'), j.body ?? pages.map(p => p.body).join('\n'));
  corpusCopyText.set(el.querySelector('[data-copy-reading]'), plain);
  if (currentStudyParagraph) showCorpusStudy(currentStudyParagraph);
}

function showCorpusStudy(id, selectedText = '') {
  const el = $('#reader'), panel = el.querySelector('.corpus-study');
  const page = currentCorpusUnit?.reading?.pages?.find(p => p.paragraphId === Number(id));
  if (!panel || !page || page.kind === 'heading') return;
  currentStudyParagraph = page.paragraphId;
  panel.classList.add('is-open');
  el.querySelectorAll('.corpus-page.is-current').forEach(node => node.classList.remove('is-current'));
  el.querySelector(`[data-paragraph-id="${page.paragraphId}"]`)?.classList.add('is-current');
  const item = page.explanation;
  panel.innerHTML = `<button class="corpus-study-close" data-study-close aria-label="关闭译注">关闭 ×</button><div class="corpus-study-kicker">第 ${esc(page.seq)} 段 · 研读</div><h3>段落译注</h3>${item ?
    `<small>${esc(item.aiLabel)}</small><h4>译文</h4><p>${esc(item.translation)}</p>${item.notes?.length ? `<h4>注释</h4><ol>${item.notes.map(n => `<li${selectedText && [n.quote,n.quoteSimplified].filter(Boolean).some(q => selectedText.includes(q) || q.includes(selectedText)) ? ' class="is-related"' : ''}><b>${esc(n.quote)}</b>　${esc(n.explanation)}</li>`).join('')}</ol>` : ''}<small>依据本段来源原字；译注未经过人工审校。</small>` : '<p>译注待补</p><small>正文可以继续阅读；本段尚无可展示的译注。</small>'}<p><a class="tag" href="https://github.com/lz1219/poem-data/issues/new?title=${encodeURIComponent('译注反馈 · '+(currentCorpusUnit.book || '')+' · '+corpusReadingHeading(currentCorpusUnit)+' · 段'+page.paragraphId)}" target="_blank" rel="noopener noreferrer">反馈这一段 ↗</a></p>`;
}

document.addEventListener('mouseup', () => {
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || !selection.toString().trim()) return;
  const parent = node => (node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement)?.closest('.corpus-page[data-paragraph-id]');
  const start = parent(selection.anchorNode), end = parent(selection.focusNode);
  if (start && start === end && start.dataset.paragraphId) showCorpusStudy(start.dataset.paragraphId, selection.toString().trim());
});

document.addEventListener('click', async e => {
  if (e.target.closest('[data-study-close]')) { currentStudyParagraph = null; const panel = e.target.closest('.corpus-study'); panel.classList.remove('is-open'); panel.innerHTML = '<div class="corpus-study-kicker">研读 · 译注</div><h3>与原文同行</h3><p>选中一句或点击段旁“译注”，查看所在段落的译文与注释。</p>'; $('#reader .corpus-page.is-current')?.classList.remove('is-current'); return; }
  const linked = e.target.closest('[data-linked-work]');
  if (linked) {
    const key=linked.dataset.linkedWork, slot=$('#linked-work-slot');
    slot.textContent='正在查找关联…';
    try {
      const response=await fetch('/api/works/'+encodeURIComponent(key)+'/links');
      if (!response.ok) throw new Error();
      const result=await response.json();
      if (CUR?.key !== key || CUR?.mode !== 'works') return;
      slot.innerHTML=result.items?.length ? result.items.map(x => `<div class="note"><div class="k">候选关联 · 未经人工审校</div><p>${esc(x.differences)}</p><a class="tag acc" href="#" data-poem="${x.poemId}">阅读另一文本见证 →</a> ${x.stops.map(s => `<a class="tag" href="#" data-jump="${esc(s.journeyKey)}">查看引用此作的行迹 →</a>`).join('')}</div>`).join('') : '<p class="src">暂无可展示的关联，或关联所据文本已变化，待重新核查。</p>';
    } catch (_) { if (CUR?.key===key) slot.textContent='关联暂时无法读取。'; }
    return;
  }
  const study = e.target.closest('[data-study-paragraph]');
  if (study) { showCorpusStudy(study.dataset.studyParagraph); return; }
  const poemPage = e.target.closest('[data-poem-page]');
  if (poemPage) { openApi('texts', poemPage.dataset.poemPage, Number(poemPage.dataset.offset), poemPage.dataset.query); return; }
  const book = e.target.closest('[data-corpus-book]');
  if (book) { openApi('texts', book.dataset.corpusBook); return; }
  const script = e.target.closest('[data-corpus-script]'), notes = e.target.closest('[data-corpus-notes]'), size = e.target.closest('[data-corpus-size]');
  if (currentCorpusUnit && (script || notes || size)) {
    const el = $('#reader'), ratio = el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight);
    const focusSelector = script ? `[data-corpus-script="${script.dataset.corpusScript}"]` : notes ? '[data-corpus-notes]' : `[data-corpus-size="${size.dataset.corpusSize}"]`;
    if (script) corpusReadingPrefs.script = script.dataset.corpusScript;
    if (notes) corpusReadingPrefs.notes = !corpusReadingPrefs.notes;
    if (size) corpusReadingPrefs.size = Math.max(18, Math.min(26, corpusReadingPrefs.size + Number(size.dataset.corpusSize)));
    try { localStorage.setItem('corpus-reading', JSON.stringify(corpusReadingPrefs)); } catch (_) { /* Optional. */ }
    renderCorpusReading(currentCorpusUnit);
    el.querySelector(focusSelector)?.focus({preventScroll:true});
    el.scrollTop = ratio * Math.max(0, el.scrollHeight - el.clientHeight);
    return;
  }
  const copy = e.target.closest('[data-copy-reading]');
  if (copy) {
    try { await navigator.clipboard.writeText(corpusCopyText.get(copy) || ''); copy.textContent = '已复制'; }
    catch (_) { copy.textContent = '复制失败，请手动选择'; }
    setTimeout(() => { copy.textContent = '复制当前文字'; }, 1600);
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-poem-search-book]');
  if (form) { e.preventDefault(); openApi('texts', form.dataset.poemSearchBook, 0, new FormData(form).get('q') || ''); }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-corpus-select]')) openJuan(e.target.value);
});

// 详情里的诗/卷跳转
document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-print]')) { window.print(); return; }

  const gp = e.target.closest('[data-goperson]');
  if (gp) {
    e.preventDefault();
    location.hash = '#/person/' + encodeURIComponent(gp.getAttribute('data-goperson'));
    return;
  }

  const relBtn = e.target.closest('[data-relations]');
  if (relBtn) {
    const key = relBtn.getAttribute('data-relations');
    const slot = document.getElementById('relations-slot');
    if (!slot) return;
    if (slot.dataset.open === key) { slot.innerHTML = ''; slot.dataset.open = ''; return; }
    slot.innerHTML = '<p class="empty">正在取关系数据…</p>';
    try {
      const r = await fetch('/api/persons/' + encodeURIComponent(key) + '/relations').then((x) => x.json());
      if (!r.kinship || (!r.kinship.length && !r.assoc.length)) {
        slot.innerHTML = '<p class="empty">' + (r.note || 'CBDB 无关系数据') + '</p>';
        return;
      }
      const nm = (x) => x.key
        ? '<a href="#" data-goperson="' + x.key + '" style="border-bottom:1px dotted var(--line-2)">' + x.name + '</a>'
        : x.name;
      const kin = (r.kinship || []).map((k) =>
        '<li><span>' + nm(k) + '</span><span class="r">' + (k.relation || '') + '</span></li>').join('');
      const asso = (r.assoc || []).map((a) =>
        '<li><span>' + nm(a) + '</span><span class="r">' +
        (a.times > 1 ? a.times + ' 次' : '') + (a.first_year ? ' ' + a.first_year : '') + '</span></li>').join('');
      slot.innerHTML = '<div class="rel">' +
        '<div><h4>亲属 · ' + r.total.kinship + '</h4><ul>' + (kin || '<li class="muted">无</li>') + '</ul></div>' +
        '<div><h4>交游 · ' + r.total.assoc + '</h4><ul>' + (asso || '<li class="muted">无</li>') + '</ul></div>' +
        '</div>';
      slot.dataset.open = key;
    } catch (err) {
      slot.innerHTML = '<p class="empty">关系接口不可用。</p>';
    }
    return;
  }

  const tlBtn = e.target.closest('[data-timeline]');
  if (tlBtn) {
    const key = tlBtn.getAttribute('data-timeline');
    const slot = document.getElementById('timeline-slot');
    if (!slot) return;
    if (slot.dataset.open === key) { slot.innerHTML = ''; slot.dataset.open = ''; return; }
    slot.innerHTML = '<p class="empty">正在取年表…</p>';
    try {
      const r = await fetch('/api/persons/' + encodeURIComponent(key) + '/timeline').then((x) => x.json());
      if (!r.events || !r.events.length) { slot.innerHTML = '<p class="empty">暂无年表数据。</p>'; return; }
      const KIND = { life: '生卒', office: '仕历', work: '作品' };
      const rows = r.events.map((ev) => {
        const cls = ev.kind;
        const t = ev.kind === 'work'
          ? '<a href="#" data-work="' + ev.key + '" style="border-bottom:1px dotted var(--line)">' + ev.title + '</a>'
          : (ev.title || '');
        const place = ev.place ? ' · ' + ev.place : '';
        return '<div class="tl-row ' + cls + '"><span class="tl-year">' + (ev.year || '?') + '</span>' +
          '<span class="tl-title">' + t + '</span>' +
          '<span class="tl-place">' + place + '</span>' +
          '<span class="tl-kind">' + (KIND[ev.kind] || '') + '</span></div>';
      }).join('');
      slot.innerHTML = '<div class="tl-sum">' + (r.journey ? '行迹《' + r.journey + '》 · ' : '') +
        '共 ' + r.total + ' 条（生卒 / 仕历 / 作品）</div><div class="tl">' + rows + '</div>';
      slot.dataset.open = key;
    } catch (err) {
      slot.innerHTML = '<p class="empty">年表接口不可用。</p>';
    }
    return;
  }

  const corpusAuthorBtn = e.target.closest('[data-author-corpus]');
  if (corpusAuthorBtn) {
    const author = corpusAuthorBtn.getAttribute('data-author-corpus');
    const slot = document.getElementById('author-corpus-slot');
    if (!slot) return;
    if (slot.dataset.open === author) { slot.innerHTML = ''; slot.dataset.open = ''; return; }
    if (STATIC_ONLY) {
      slot.innerHTML = '<p class="empty">馆藏全部语料需在完整接口服务中查看。</p>';
      return;
    }
    slot.innerHTML = '<p class="empty">正在获取语料库作品列表…</p>';
    try {
      const r = await fetch('/api/corpus/authors/' + encodeURIComponent(author) + '?limit=100').then(x => x.json());
      if (!r.items || !r.items.length) {
        slot.innerHTML = '<p class="empty">语料库中暂无该作者作品收录。</p>';
        return;
      }
      slot.innerHTML =
        '<div class="compare">' +
        '<div class="compare-head"><span>语料库收录诗词 · 共 ' + r.total + ' 首（展示前 ' + r.items.length + ' 首）</span><button data-close-author-corpus="1">收起</button></div>' +
        '<table>' +
        r.items.map(p => '<tr><td style="width:140px"><a href="#" data-poem="' + p.id + '">' + esc(p.title) + '</a></td><td class="src">' + esc((p.head || '').replace(/\n/g, ' ')) + '</td></tr>').join('') +
        '</table>' +
        (r.total > r.items.length ? '<p class="src" style="margin-top:8px">另有 ' + (r.total - r.items.length) + ' 首，可通过馆藏检索-作者页查看完整目录。</p>' : '') +
        '</div>';
      slot.dataset.open = author;
    } catch (_) {
      slot.innerHTML = '<p class="empty">语料接口不可用。</p>';
    }
    return;
  }

  if (e.target.closest('[data-close-author-corpus]')) {
    const slot = document.getElementById('author-corpus-slot');
    if (slot) { slot.innerHTML = ''; slot.dataset.open = ''; }
    return;
  }

  const cmpBtn = e.target.closest('[data-compare]');
  if (cmpBtn) {
    const key = cmpBtn.getAttribute('data-compare');
    const slot = document.getElementById('compare-slot');
    if (!slot) return;
    if (slot.dataset.open === key) { slot.innerHTML = ''; slot.dataset.open = ''; return; }
    slot.innerHTML = '<p class="empty">正在取语料库原文…</p>';
    try {
      const r = await fetch('/api/works/' + encodeURIComponent(key) + '/corpus').then((x) => x.json());
      if (!r.matches || !r.matches.length) {
        slot.innerHTML = '<p class="empty">未找到首句对应的候选文本，可能存在异文或尚未收录。</p>';
        return;
      }
      const m = r.matches[0];
      const body = (m.body_simplified || m.body || '').trim();
      slot.innerHTML =
        '<div class="compare">' +
        '<div class="compare-head"><span>语料库候选对照 · 未经人工审校</span><button data-close-compare="1">收起</button></div>' +
        '<div class="compare-meta">' + (m.author || '') + '《' + (m.title_raw || m.title || '') + '》' +
        (m.id ? ' &nbsp;·&nbsp; <a class="tag acc" href="#" data-poem="' + m.id + '">进入此版本见证详情与原卷 ↗</a>' : '') + '</div>' +
        '<div class="compare-body">' + body.replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) + '</div>' +
        '</div>';
      slot.dataset.open = key;
    } catch (err) {
      slot.innerHTML = '<p class="empty">对照接口不可用。</p>';
    }
    return;
  }

  if (e.target.closest('[data-close-compare]')) {
    const slot = document.getElementById('compare-slot');
    if (slot) { slot.innerHTML = ''; slot.dataset.open = ''; }
    return;
  }

  if (e.target.closest('[data-copy]')) {
    const btn = e.target.closest('[data-copy]');
    const text = [...document.querySelectorAll('.reader .rc')].map((n) => n.innerText).join('\n');
    try { await navigator.clipboard.writeText(text); } catch (_) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    btn.textContent = '已复制'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '复制正文'; btn.classList.remove('copied'); }, 1600);
    return;
  }

  if (e.target.closest('[data-copyraw]')) {
    const btn = e.target.closest('[data-copyraw]');
    const node = document.querySelector('.reader .rc');
    const text = corpusCopyText.get(btn) ?? (node ? node.innerText : '');
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '已复制';
    } catch (_) { btn.textContent = '复制失败，请手动选择'; }
    setTimeout(() => { btn.textContent = btn.dataset.copyLabel || '复制全文'; }, 1600);
    return;
  }

  const tw = e.target.closest('[data-toggle-work]');
  if (tw) {
    e.preventDefault();
    const workKey = tw.dataset.toggleWork;
    const box = tw.closest('.journey-stop-work-wrap');
    if (!box) return;
    const body = box.querySelector('.journey-work-inline-body');
    if (!body) return;
    const isOpen = body.style.display !== 'none';
    if (isOpen) {
      body.style.display = 'none';
      tw.setAttribute('aria-expanded', 'false');
      const arrow = tw.querySelector('.work-arrow');
      if (arrow) arrow.textContent = '▾ 展开研读';
      return;
    }
    body.style.display = 'block';
    tw.setAttribute('aria-expanded', 'true');
    const arrow = tw.querySelector('.work-arrow');
    if (arrow) arrow.textContent = '▴ 收起';
    if (body.dataset.loaded !== '1') {
      body.innerHTML = '<div style="font-size:12px;color:var(--muted)">正在加载作品《' + esc(workKey) + '》全文及笺注…</div>';
      try {
        const w = await loadData('/api/works/' + encodeURIComponent(workKey), 'data/works/' + encodeURIComponent(workKey) + '.json');
        const paras = (w.text && (w.text.paragraphsSimplified || w.text.paragraphs)) || [];
        const paraHtml = paras.map(p => '<div class="work-para">' + esc(p) + '</div>').join('');
        const meaningHtml = w.meaning ? '<div class="work-meaning"><strong>大意：</strong>' + esc(w.meaning) + '</div>' : '';
        const notesHtml = (w.notes && w.notes.length) ? '<div style="margin-top:8px;font-size:12px;color:var(--muted)"><strong>笺注：</strong>' + w.notes.slice(0, 3).map(n => esc(n.term) + '（' + esc(n.explain) + '）').join('； ') + '</div>' : '';
        const citationHtml = w.citation ? '<div style="margin-top:6px;font-size:11px;color:var(--muted)">出处：' + esc(w.citation) + '</div>' : '';
        body.innerHTML =
          '<div style="font-weight:600;margin-bottom:8px;font-family:var(--serif);font-size:15px;color:var(--ink);">' + esc(w.titleZh || w.key) + '</div>' +
          paraHtml +
          meaningHtml +
          notesHtml +
          citationHtml +
          '<div class="work-actions" style="margin-top:10px;"><a class="tag acc" href="#/work/' + encodeURIComponent(workKey) + '" data-work="' + esc(workKey) + '">在作品库中研读全篇与多版本见证 →</a></div>';
        body.dataset.loaded = '1';
      } catch (err) {
        body.innerHTML = '<div style="color:var(--warn)">未能加载作品详情，请稍后重试。</div>';
      }
    }
    return;
  }

  const pa = e.target.closest('[data-poem]');
  const ja = e.target.closest('[data-juan]');
  if (pa) { e.preventDefault(); openPoem(pa.dataset.poem); }
  if (ja) { e.preventDefault(); openJuan(ja.dataset.juan); }
});

/* ── 打开详情 ── */
async function open(mode, key, stopSeq = null) {
  const meta = IDX[mode].find(x => x.key === key);
  if (!meta) return;
  const id = mode + ':' + key;
  let data = cache.get(id);
  if (!data) {
    data = await loadData('/api/' + mode + '/' + encodeURIComponent(key), 'data/' + mode + '/' + encodeURIComponent(key) + '.json');
    cache.set(id, data);
  }
  if (mode === 'persons') data = {...data, courtesyZh:data.courtesyZh ?? data.courtesy_zh, spanNote:data.spanNote ?? data.span_note, journeyKey:data.journeyKey ?? data.journey_key, externalIds:data.externalIds ?? {cbdb:data.cbdb_id, wikidata:data.wikidata_id}};
  CUR = { key, mode };
  const el = $('#reader');
  if (mode === 'works') el.innerHTML = renderWork(data);
  else if (mode === 'persons') el.innerHTML = renderPerson(data);
  else el.innerHTML = renderJourney(data);
  $('.main').classList.add('mobile-detail');
  el.insertAdjacentHTML('afterbegin', '<button type="button" class="mobile-list-return" data-mobile-list-return>← 返回列表</button>');
  el.scrollTop = 0;
  if (mode === 'works') { loadPoetryReading(data); loadWorkWitnesses(data.key); }
  history.replaceState(null, '', `#/${mode === 'works' ? 'work' : mode === 'persons' ? 'person' : 'journey'}/${encodeURIComponent(key)}`);
  if (mode === 'journeys' && /^\d+$/.test(String(stopSeq || ''))) el.querySelector(`[data-journey-stop="${Number(stopSeq)}"]`)?.scrollIntoView({block:'start'});
}

/* ── 作品 ── */
async function loadWorkWitnesses(key) {
  const slot = document.getElementById('linked-work-slot');
  if (!slot) return;
  try {
    const res = await fetch('/api/works/' + encodeURIComponent(key) + '/links');
    if (!res.ok) return;
    const data = await res.json();
    if (CUR?.key !== key || CUR?.mode !== 'works') return;
    if (!data.items?.length) return;
    slot.innerHTML = data.items.map(x => `
      <div class="note variant-note" style="margin:12px 0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px">
        <div class="k" style="font-weight:600;color:var(--ink)">版本见证与异文考证 · 未经人工审校</div>
        <p style="margin:6px 0;line-height:1.6">${esc(x.differences)}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <a class="tag acc" href="#" data-poem="${x.poemId}">查看语料库底本详情（Poem ID ${x.poemId}） ↗</a>
          ${(x.stops || []).map(s => `<a class="tag" href="#/journey/${encodeURIComponent(s.journeyKey)}" data-jump="${esc(s.journeyKey)}" data-stop="${esc(s.stopSeq)}">驻足行迹：${esc(s.journeyKey)} 第 ${esc(s.stopSeq)} 站 ↗</a>`).join('')}
        </div>
      </div>
    `).join('');
  } catch (_) { /* 静默 */ }
}

let poetryReadingPromise;
async function loadPoetryReading(work) {
  if (!['shi', 'ci'].includes(work.genre)) return;
  try {
    poetryReadingPromise ||= fetch('data/poetry-reading/pilot-20261105.json').then(r => {
      if (!r.ok) throw new Error('阅读资料不可用');
      return r.json();
    });
    const collection = await poetryReadingPromise;
    const entry = collection.works?.[work.key];
    if (!entry || CUR?.mode !== 'works' || CUR.key !== work.key) return;
    // 不将已有译注自动套用到正文或底本已变化的作品。
    if (entry.sourceEdition !== work.text?.sourceEdition ||
        JSON.stringify(entry.sourceOriginal) !== JSON.stringify(work.text?.paragraphs) ||
        JSON.stringify(entry.sourceParagraphs) !== JSON.stringify(work.text?.paragraphsSimplified) ||
        entry.segments?.length !== entry.sourceParagraphs.length ||
        entry.segments.some((s, i) => s.source !== entry.sourceParagraphs[i])) return;
    const slot = document.getElementById('poetry-reading-slot');
    if (!slot) return;
    const original = document.querySelector('#reader .work-body .rc');
    const legacy = document.getElementById('work-legacy-notes');
    if (legacy) legacy.open = false;
    if (original) {
      original.classList.add('work-lines');
      original.innerHTML = entry.sourceOriginal.map((line, i) => `<button type="button" class="work-line" data-poetry-original="${i}" aria-pressed="false" aria-label="阅读第 ${i + 1} 段译注">${(line.match(/[^，。！？；：]+[，。！？；：]?|[，。！？；：]/g) || []).map(part => `<span class="work-phrase">${esc(part)}</span>`).join('')}</button>`).join('');
      original.insertAdjacentHTML('afterend', '<p class="work-reading-hint">点击原文，查看对应译注</p>');
    }
    const render = index => {
      const segment = entry.segments[index];
      const related = entry.notes.filter(n => segment.source.includes(n.term));
      slot.innerHTML = `<section class="work-reading" aria-label="作品译注">
        <button type="button" class="work-reading-close" data-poetry-close aria-label="关闭译注">关闭</button>
        <div class="work-reading-head"><h3>读这首作品</h3><small>${esc(collection.generation.label)}</small></div>
        <div class="work-reading-nav" aria-label="选择原文段落">${entry.segments.map((_, i) => `<button type="button" data-poetry-segment="${i}" aria-pressed="${i === index}">${entry.segments.length === 1 ? '全文' : '第 ' + (i + 1) + ' 段'}</button>`).join('')}</div>
        <div aria-live="polite"><blockquote>${esc(segment.source)}</blockquote><small>译文</small><p>${esc(segment.translation)}</p>
        ${related.length ? `<details open><summary>本段注释</summary><dl>${related.map(n => `<dt>${esc(n.term)}</dt><dd>${esc(n.explanation)}</dd>`).join('')}</dl></details>` : ''}</div>
        <details><summary>阅读赏析</summary><p>${esc(entry.appreciation)}</p></details>
        <small>${esc(entry.sourceStatus)} · 解释与赏析未经人工审校。</small></section>`;
    };
    slot.addEventListener('click', e => {
      if (e.target.closest('[data-poetry-close]')) {
        slot.classList.remove('is-open');
        document.querySelector('#reader [data-poetry-original][aria-pressed="true"]')?.focus();
        return;
      }
      const button = e.target.closest('[data-poetry-segment]');
      if (button) {
        const index = Number(button.dataset.poetrySegment);
        render(index);
        original?.querySelectorAll('[data-poetry-original]').forEach((b, i) => b.setAttribute('aria-pressed', String(i === index)));
        slot.querySelector(`[data-poetry-segment="${index}"]`)?.focus();
      }
    });
    original?.addEventListener('click', e => {
      const button = e.target.closest('[data-poetry-original]');
      if (!button) return;
      const index = Number(button.dataset.poetryOriginal);
      original.querySelectorAll('[data-poetry-original]').forEach((b, i) => b.setAttribute('aria-pressed', String(i === index)));
      render(index);
      slot.classList.add('is-open');
      if (window.matchMedia('(max-width: 600px)').matches) slot.querySelector('[data-poetry-close]')?.focus();
      else slot.scrollIntoView({block:'nearest', behavior:'smooth'});
    });
    render(0);
  } catch (_) { /* 未发布样例时，保留作品原有阅读内容。 */ }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const slot = document.getElementById('poetry-reading-slot');
  if (!slot?.classList.contains('is-open')) return;
  slot.classList.remove('is-open');
  document.querySelector('#reader [data-poetry-original][aria-pressed="true"]')?.focus();
});

function renderWork(w) {
  const author = IDX.persons.find(p => p.key === w.authorKey);
  const badges = [
    w.excerpt ? '<span class="tag warn" title="正文为长文中的一段，非全篇">摘录</span>' : '',
    `<span class="tag">${GENRE[w.genre] || w.genre}</span>`,
    `<span class="tag">系年 ${{confirmed:'确考',probable:'近是',disputed:'有争议',unknown:'待核'}[w.certainty] || '待核'}</span>`,
    w.text?.traditionalDerived ? '<span class="tag warn">繁体为反推</span>' : '<span class="tag">繁体取自底本</span>',
  ].join('');
  const excerptNote = (w.notes || []).find(n => n.term === '摘录说明');
  const excerptBanner = w.excerpt ? `
    <div class="note excerpt-banner" style="margin:12px 0;background:var(--bg-soft);border:1px dashed var(--accent);border-radius:6px;padding:12px 14px">
      <div style="font-weight:600;font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:6px">
        <span>⚠ 长文摘录 · 非全篇连续正文</span>
      </div>
      <p style="margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--ink)">
        ${excerptNote ? esc(excerptNote.explain) : '本篇正文为原典长篇诗文中的节选摘录；若需查阅原卷全篇，可通过下方“相关文本与行迹”或“语料对照”查看完整底本。'}
      </p>
    </div>` : '';
  return `
    <header class="work-heading"><div class="work-eyebrow">江山行止 · 作品</div>
    <h2 class="rt">${esc(w.titleZh)}</h2>
    <div class="ra">${author ? `<a href="#/person/${encodeURIComponent(author.key)}" data-goperson="${esc(author.key)}">${esc(author.zh)}</a>` : ''}${author && w.titleEn ? ' · ' : ''}${esc(w.titleEn || '')}</div>
    <div class="badges">${badges}${author?.journeyKey ? `<a class="tag maplink" href="${atlasLink({ person: author.journeyKey, year: w.composed?.year })}" target="_blank" rel="noopener">行迹地图 ↗</a>` : ''}</div></header>
    <div class="work-body"><div class="rc${w.genre === 'shi' || w.genre === 'ci' ? ' work-verse' : ' left'}">${esc((w.text?.paragraphs || []).join('\n'))}</div></div>
    ${excerptBanner}
    <div id="poetry-reading-slot"></div>
    <div class="reader-tools">
      <button data-copy="1">复制正文</button>
      <button data-compare="${esc(w.key)}">语料对照</button>
      <button data-linked-work="${esc(w.key)}">相关文本与行迹</button>
      <button data-print="1">打印</button>
    </div>
    <div id="compare-slot"></div>
    <div id="linked-work-slot"></div>
    <details class="work-meta"><summary>版本与出处 · 资料待核</summary><p class="src">${w.composed?.placeZh ? '关联地点（待核）：' + esc(w.composed.placeZh) + ' · ' : ''}${esc(w.citation || '出处待补')}</p><p class="src"><a href="${researchLink('work', w.key)}">查看版本、证据与核查记录 ↗</a></p></details>
    <details id="work-legacy-notes" class="work-meta" open><summary>原有整理内容 · 大意、注释与赏析</summary>
    ${w.meaning ? `<div class="bh">大意</div><p>${esc(w.meaning)}</p>` : ''}
    ${w.notes?.length ? `<div class="bh">注释</div><table>${w.notes.map(n => `<tr><th style="width:120px">${esc(n.term)}</th><td>${esc(n.explain)}</td></tr>`).join('')}</table>` : ''}
    ${w.background ? `<div class="bh">写作背景</div><p>${esc(w.background)}</p>` : ''}
    ${w.appreciation?.text ? `<div class="bh">赏析</div><p>${esc(w.appreciation.text)}</p>
      ${w.appreciation.inference ? `<div class="note"><div class="k">历史推测 · 生成方式未记录 · 未经人工审校</div>${esc(w.appreciation.inference.text)}
        <div class="src">依据：${esc(w.appreciation.inference.basis)}</div></div>` : ''}
      <div class="src">${esc(w.appreciation.by)} · ${esc(w.appreciation.license)}</div>` : ''}</details>
    ${w.apparatus?.length ? `<div class="bh">校记</div>${w.apparatus.map(a => `<div class="note">
        <div class="k">异文</div>
        <div><code>${esc(a.baseText)}</code> / <code>${esc(a.variantText)}</code>${a.locator?.label ? ' · ' + esc(a.locator.label) : ''} · 判定 <b>${esc(a.judgement)}</b></div>
        <div class="src">${esc(a.basis)}</div></div>`).join('')}` : ''}
    ${w.dating?.length ? `<div class="bh">系年</div><table>
      <tr><th>说法</th><th>依据</th><th>采否</th></tr>
      ${w.dating.map(d => `<tr><td>${esc(d.claim)}</td>
        <td>${d.evidence.map(e => `${esc(e.quote)}<div class="src">${esc(e.source)}（${esc(e.grade)} 级）</div>`).join('')}</td>
        <td>${esc(d.stance)}</td></tr>`).join('')}</table>` : ''}
    <div class="bh">历代评点</div>
    <p class="empty">${w.commentaryFile ? '见 ' + esc(w.commentaryFile) : '暂无。未找到可核原文的评点，不编造。'}</p>`;
}

/* ── 人物 ── */
function renderPerson(p) {
  const works = IDX.works.filter(w => w.authorKey === p.key);
  const preferred = p.key === 'sushi' ? ['定风波', '水调歌头', '念奴娇'] : [];
  const selected = preferred.map(key => works.find(w => w.key === key)).filter(Boolean);
  const featured = selected.length ? selected : works.slice(0, 3);
  const hasJourney = p.journeyKey && IDX.journeys.some(j => j.key === p.journeyKey);
  // 仕历是异步的，先占位，回来再填
  setTimeout(() => loadCareer(p.key), 0);
  if (p.key === 'sushi' && hasJourney) setTimeout(() => loadPersonJourney(p), 0);
  return `
    <header class="person-intro person-topic-header"><div><div class="work-eyebrow">人物 · 文献与行迹</div><h2 class="rt">${esc(p.zh)}</h2>
    <p class="person-subtitle">${esc(p.courtesyZh || '')}${p.spanNote ? ` · ${esc(p.spanNote)}` : ''}</p>
    <p class="src"><a href="${researchLink('person', p.key)}">查看身份与来源核查 ↗</a></p></div>
    <div class="person-topic-side">生卒 <strong>${p.span?.[0] ?? '?'}—${p.span?.[1] ?? '?'}</strong><span>馆藏精选作品 ${works.length} 篇${hasJourney ? ' · 已有行迹资料' : ''}</span><br><span>生平和作品关系继续核查</span></div></header>
    <nav class="person-paths" aria-label="人物阅读入口">
      ${hasJourney ? `<a class="person-path" href="#/journey/${encodeURIComponent(p.journeyKey)}" data-jump="${esc(p.journeyKey)}"><strong>循行迹阅读 →</strong><span>沿已有站点查看记述与引文</span></a>` : ''}
      ${featured.length ? '<a class="person-path" href="#" data-person-works><strong>从作品入读 →</strong><span>阅读诗文、译注与来源</span></a>' : ''}
    </nav>
    ${p.key === 'sushi' && hasJourney ? '<section id="person-journey-preview" aria-label="行迹与作品"><p class="person-story-intro">正在读取行迹…</p></section>' : ''}
    ${featured.length ? `<div class="bh" id="person-works">精选作品</div><div class="person-featured">${featured.map(w => `<a href="#/work/${encodeURIComponent(w.key)}" data-work="${esc(w.key)}"><span>${esc(w.titleZh)}</span><small>${esc(GENRE[w.genre] || w.genre)} · 阅读 →</small></a>`).join('')}</div>` : ''}
    <div class="reader-tools" style="justify-content:flex-start;margin:10px 0 2px">
      <button data-timeline="${esc(p.key)}">作者年表</button>
      <button data-relations="${esc(p.key)}">人物关系</button>
    </div>
    <div id="timeline-slot"></div>
    <div id="relations-slot"></div>
    <div id="career-slot"></div>
    ${p.aliases?.length ? `<div class="bh">别名</div><p>${esc(p.aliases.join('、'))}</p>` : ''}
    ${p.journeyKey ? `<div class="bh">行迹</div>
      <p><a href="#" data-jump="${esc(p.journeyKey)}" style="border-bottom:1px dotted var(--line-2)">在本站读行迹 →</a>
         &nbsp;·&nbsp;
         <a class="maplink" href="${atlasLink({ person: p.journeyKey })}" target="_blank" rel="noopener">在地图上看 ↗</a></p>` : ''}
    <div class="bh">精选研读作品（${works.length} 篇）</div>
    <table>${works.map(w => `<tr>
      <td style="width:90px" class="muted">${w.year ?? '?'}</td>
      <td><a href="#" data-work="${esc(w.key)}" style="border-bottom:1px dotted var(--line)">${esc(w.titleZh)}</a></td>
      <td class="muted">${GENRE[w.genre] || w.genre}</td></tr>`).join('')}</table>
    <div class="reader-tools" style="justify-content:flex-start;margin:16px 0 6px">
      <button data-author-corpus="${esc(p.zh)}">查看馆藏全部诗词（全文语料库）</button>
    </div>
    <div id="author-corpus-slot"></div>`;
}

function quotedWorkForStop(j, stop) {
  const quote = stop.quote || stop.quote_zh || '';
  if (!quote) return null;
  const titles = [...quote.matchAll(/《([^》]+)》/g)].map(m => m[1]);
  if (!titles.length) return null;
  const authorKey = j.personKey || j.key;

  // 1. 优先找作者本人且题名/别名/包含匹配的作品
  const authorMatches = IDX.works.filter(w => {
    if (w.authorKey !== authorKey) return false;
    return titles.some(t => t === w.key || t.startsWith(w.key) || w.key.startsWith(t) || (w.titleZh && w.titleZh.includes(t)) || (w.aliases && w.aliases.includes(t)));
  });
  if (authorMatches.length >= 1) return authorMatches[0];

  // 2. 次选：传记、史志、友人题赠等相关传世名篇（如《史记》《三国志》《年谱》《蜀相》等）
  const allMatches = IDX.works.filter(w => {
    return titles.some(t => t === w.key || t.startsWith(w.key) || w.key.startsWith(t) || (w.titleZh && w.titleZh.includes(t)) || (w.aliases && w.aliases.includes(t)));
  });
  return allMatches.length >= 1 ? allMatches[0] : null;
}

async function loadPersonJourney(person) {
  const slot = document.getElementById('person-journey-preview');
  if (!slot) return;
  try {
    const j = await loadData('/api/journeys/' + encodeURIComponent(person.journeyKey), 'data/journeys/' + encodeURIComponent(person.journeyKey) + '.json');
    if (!slot.isConnected || CUR?.mode !== 'persons' || CUR.key !== person.key) return;
    const stops = [4,5,8,9].map(seq => (j.stops || []).find(s => Number(s.seq) === seq)).filter(Boolean);
    if (!stops.length) { slot.innerHTML = ''; return; }
    slot.innerHTML = `<div class="person-story-head"><h3>沿着行迹读作品</h3><a href="#/journey/${encodeURIComponent(person.journeyKey)}" data-jump="${esc(person.journeyKey)}">查看全部行迹 →</a></div>
      <p class="person-story-intro">节选现有行迹记录；站点年份、引文及出处均待核，站点引用不等于作品写作地点。</p>
      ${stops.map(s => { const work = quotedWorkForStop(j,s); const place = s.place || {ancient:s.place_ancient}; const quote = s.quote || s.quote_zh || '';
        return `<div class="person-stop"><div class="person-stop-year">站点年份<strong>${esc(s.year ?? '待核')}</strong></div><div><div class="person-stop-title"><h4>${esc(place.ancient || '地点待核')}</h4><a href="#/journey/${encodeURIComponent(person.journeyKey)}" data-jump="${esc(person.journeyKey)}" data-stop="${esc(s.seq)}">查看站点 →</a></div>
          ${quote ? `<p class="person-stop-quote">${esc(quote)}</p>` : ''}<div class="person-stop-source">记录来源：${esc(s.source || '待补')} · 待核${work ? ` <a href="#/work/${encodeURIComponent(work.key)}" data-work="${esc(work.key)}">阅读所引作品 · 关联待核 →</a>` : ''}</div></div></div>`;
      }).join('')}`;
  } catch (_) { if (slot.isConnected) slot.innerHTML = '<p class="person-story-intro">行迹资料暂不可用，请稍后再试。</p>'; }
}

/* 仕历：CBDB 的任职记录，59 万条里属于这个人的那几十条 */
async function loadCareer(key) {
  const slot = document.getElementById('career-slot');
  if (!slot) return;
  if (STATIC_ONLY) {
    slot.innerHTML = FULL_SITE
      ? '<div class="bh">仕历</div><p class="empty">仕历来自 CBDB，需在<a href="' + FULL_SITE + '/#/person/' + encodeURIComponent(key) + '" target="_blank" rel="noopener">完整版</a>查看。</p>'
      : '<div class="bh">仕历</div><p class="empty">静态版不含仕历数据。</p>';
    return;
  }
  try {
    const r = await fetch(`/api/persons/${encodeURIComponent(key)}/career`).then(x => x.json());
    if (!r.items || !r.items.length) {
      slot.innerHTML = `<div class="bh">仕历</div><p class="empty">${esc(r.note || 'CBDB 无任职记录')}</p>`;
      return;
    }
    slot.innerHTML = `<div class="bh">仕历 <span class="tag">CBDB ${esc(r.cbdbId)} · ${r.total} 条</span></div>
      <table>${r.items.map(x => `<tr>
        <td style="width:96px" class="muted">${x.first_year ?? '?'}${x.last_year ? '–' + x.last_year : ''}</td>
        <td>${esc(x.office || '')}</td>
        <td class="muted" style="width:120px">${esc(x.places || '')}</td></tr>`).join('')}</table>`;
  } catch (e) {
    slot.innerHTML = '<div class="bh">仕历</div><p class="empty">接口不可用</p>';
  }
}

/* ── 行迹 ── */
function renderJourney(j) {
  const links = j.links || {};
  const rows = j.stops.map((s, i) => {
    const link = links[String(i + 1)];
    const place = s.place || {ancient:s.place_ancient, modern:s.place_modern};
    const quote = s.quote || s.quote_zh || '';
    const quotedWork = quotedWorkForStop(j,s);
    return `${link ? `<tr><td colspan="3"><div class="note"><div class="k">承接</div>${esc(link.text)}
        <div class="src">据 ${esc(link.source)}</div></div></td></tr>` : ''}
      <tr data-journey-stop="${esc(s.seq || i + 1)}"><td style="width:96px;font-family:var(--serif);color:var(--gold)">${esc(s.eraZh || s.year || '')}</td>
      <td style="width:132px"><b>${esc(place.ancient || '')}</b>
        ${place.modern ? `<div class="src">${esc(place.modern)}</div>` : ''}
        ${place.ancient ? `<a class="maplink" href="${atlasLink({ person: j.personKey || j.key, year: s.year })}" target="_blank" rel="noopener">地图 ↗</a>` : ''}</td>
      <td>${esc(s.titleZh || s.title_zh || '')}<div class="muted" style="font-size:12.5px">${esc(s.descZh || s.desc_zh || '')}</div>
        ${quote ? `<div style="font-family:var(--serif);color:#5a4a34;margin:4px 0;">${esc(quote)}</div>` : ''}
        ${quotedWork ? `
          <div class="journey-stop-work-wrap">
            <button type="button" class="journey-work-toggle-btn" data-toggle-work="${esc(quotedWork.key)}" aria-expanded="false">
              <span>📖</span> 驻足名作：<b>《${esc(quotedWork.titleZh || quotedWork.key)}》</b> <span class="work-arrow">▾ 展开研读</span>
            </button>
            <div class="journey-work-inline-body" style="display:none;" data-loaded="0"></div>
          </div>` : ''}
        <div class="src" style="margin-top:4px;">据 ${esc(s.source)}</div></td></tr>`;
  }).join('');

  return `
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <a class="tag acc" href="data/journeys/${encodeURIComponent(j.key)}.json" download="${esc(j.key)}.json" target="_blank">📥 导出行迹 JSON</a>
      <a class="tag maplink" href="${atlasLink({ person: j.personKey || j.key })}" target="_blank" rel="noopener">🗺 在《江山行止》地图中漫游 ↗</a>
      <a class="tag" href="${researchLink('journey', j.key)}">🔍 查看学术证据与待核事项 ↗</a>
    </div>
    <h2 class="rt">${esc(j.titleZh || j.title_zh || '')}</h2>
    <div class="ra">${esc(j.spanZh || j.span_zh || '')} · ${j.stops.length} 站 · ${j.origin === 'overlay' ? '本仓库补录' : '上游数据'}</div>
    ${j.intro ? `<div class="bh">读本导语</div><p>${esc(typeof j.intro === 'string' ? j.intro : j.intro.text)}</p><div class="src">据 ${esc(typeof j.intro === 'string' ? (j.intro_source || '') : j.intro.source)}</div>` : ''}
    <div class="bh">站点纪事与驻足名篇</div><table>${rows}</table>`;
}

/* ── 随机 / 今日 ── */
function dayOfYear(d) { return Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1; }

function showRandom(animate) {
  const pool = filtered;
  if (!pool.length) return;
  const r = pool[Math.floor(Math.random() * pool.length)];
  document.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x.dataset.key === r.key));
  open(MODE, r.key);
}

function showDaily() {
  const t = new Date();
  const seed = t.getFullYear() * 1000 + dayOfYear(t);
  const idx = (seed * 31) % IDX.works.length;
  const w = IDX.works[idx];
  document.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x.dataset.key === w.key));
  open('works', w.key);
}

/* 详情里的跳转链接 */
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-mobile-list-return]')) { $('.main').classList.remove('mobile-detail'); $('#list').scrollIntoView({block:'start'}); return; }
  if (e.target.closest('[data-person-works]')) { e.preventDefault(); document.getElementById('person-works')?.scrollIntoView({block:'start', behavior:'smooth'}); return; }
  const aw = e.target.closest('[data-work]');
  const aj = e.target.closest('[data-jump]');
  if (aw) { e.preventDefault(); showTool('works'); open('works', aw.dataset.work); }
  if (aj) { e.preventDefault(); MODE = 'journeys'; document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === 'journeys')); buildFilters(); renderList(); open('journeys', aj.dataset.jump, aj.dataset.stop); }
});

/* 深链 */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return false;
  const [kind, ...rest] = h.split('/');
  const key = decodeURIComponent(rest.join('/'));
  const map = { work: 'works', person: 'persons', journey: 'journeys' };
  if (map[kind]) {
    showTool(map[kind]);
    open(map[kind], key);
    return true;
  }
  return false;
}
