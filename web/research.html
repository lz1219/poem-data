<style>
:root{--paper:#f5f0e4;--ink:#352f27;--muted:#756a58;--line:#d6ccb6;--red:#983d2d;--green:#456352}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.9 'Songti SC',SimSun,serif}header{border-bottom:1px solid var(--ink);padding:36px 6vw 24px;display:flex;gap:36px;align-items:baseline}a{color:var(--red);text-underline-offset:4px}h1{font-size:34px;letter-spacing:.15em;font-weight:500;margin:0}header p{color:var(--muted);margin:0}main{max-width:1440px;margin:auto;padding:28px 5vw}.intro{max-width:850px;color:var(--muted)}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{background:transparent;border:1px solid var(--line);padding:10px;color:var(--ink);font:inherit}input{min-width:240px;flex:1}button,a:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--red)}button{cursor:pointer}button:hover{border-color:var(--red)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:40px}.list{max-height:75vh;overflow:auto;border-top:3px solid var(--ink)}.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:16px 8px}.item small{display:block;color:var(--muted);font:12px/1.8 system-ui}.item[aria-current=true]{border-left:3px solid var(--red);background:#eee4d1}article{border-top:3px solid var(--red);padding-top:20px;min-width:0}h2{font-weight:500;font-size:28px;line-height:1.5;margin:0 0 12px}h3{font-size:16px;letter-spacing:.12em;border-bottom:1px solid var(--line);padding-bottom:7px;margin-top:28px}.stamp{display:inline-block;border:1px solid var(--red);color:var(--red);padding:2px 9px;font:12px/1.8 system-ui}.meta{color:var(--muted);font:12px/1.8 system-ui}.warning{border-left:2px dashed var(--red);padding:12px 18px;background:#eee4d1}.source{border-left:2px solid var(--line);padding-left:16px;margin:20px 0;overflow-wrap:anywhere}blockquote{margin:14px 0;white-space:pre-wrap}.citation{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);padding:14px;font:12px/1.9 system-ui}.error{color:var(--red)}details{margin:18px 0}summary{cursor:pointer}#sources{margin-top:48px}#source-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}footer{margin:48px 0;color:var(--muted);font-size:12px}@media(max-width:760px){header{display:block;padding:24px}h1{font-size:28px}.layout{grid-template-columns:1fr;gap:24px}.list{max-height:250px}main{padding:20px}h2{font-size:24px}}@media(prefers-reduced-motion:no-preference){article{animation:reveal .2s ease-out}@keyframes reveal{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
.image-evidence{border:1px solid var(--line);padding:18px 20px;margin:18px 0;background:#f1e9d9}.image-evidence .stamp{border-style:dashed}.image-reading{font-size:19px;letter-spacing:.08em;margin:14px 0}.image-actions{display:flex;gap:10px;flex-wrap:wrap}.image-actions a{display:inline-block;padding:5px 12px;border:1px solid var(--line);text-decoration:none}.image-actions a:hover{border-color:var(--red);background:var(--paper)}
/* 与文献站共用纸色和文字层级，研究记录仍以证据为中心。 */
:root{--paper:#faf9f6;--ink:#252119;--muted:#766d60;--line:#e2dbcf;--red:#9e3627;--panel:#f4f0e7;--card:#fff}
@media(prefers-color-scheme:dark){:root{--paper:#121110;--ink:#ece7db;--muted:#b0a596;--line:#3a342c;--red:#e08069;--panel:#24211c;--card:#1c1a16}}
body{font-family:'Songti SC','Source Han Serif SC','Noto Serif CJK SC',SimSun,serif}
header{max-width:1320px;margin:auto;padding:32px 24px 20px;border-color:var(--line);align-items:center;gap:22px}
header h1{font-size:30px;letter-spacing:.12em}header p{font-size:13px;flex:1}header>a{font-size:13px;text-decoration:none;white-space:nowrap}header>a:hover{text-decoration:underline}
main{max-width:1320px;padding:28px 24px}.intro{max-width:none;margin:0;padding:24px 28px;background:var(--panel);color:var(--ink);line-height:2}
.tools{align-items:center;gap:8px;margin:22px 0}input,select,button{border-radius:3px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px}input,select{background:var(--card);min-height:43px}input{min-width:220px}.tools #count{color:var(--muted);font-size:12px;margin-left:auto}
.layout{grid-template-columns:300px minmax(0,1fr);gap:16px}.list{border:1px solid var(--line);background:var(--card);padding:8px;max-height:75vh}.item{padding:14px 12px;line-height:1.6;color:var(--ink)}.item small{font-family:'PingFang SC','Microsoft YaHei',sans-serif}.item[aria-current=true]{background:var(--panel);border-left:2px solid var(--red)}.item:hover{background:var(--panel)}
article{border:1px solid var(--line);background:var(--card);padding:34px clamp(24px,4vw,55px) 45px}article h2{font-size:29px;margin:18px 0 8px}h3{font-weight:500;margin-top:32px}article p,article li{line-height:2}.stamp{border-radius:2px}.warning,.image-evidence{background:var(--panel)}.source{border-color:var(--line);padding-left:18px}.source blockquote{font-size:17px;line-height:2}.citation{background:var(--panel);font-size:12px}#sources{border-top:1px solid var(--line);padding-top:18px}footer{border-top:1px solid var(--line);padding-top:18px}
@media(max-width:760px){header{display:flex;flex-wrap:wrap;padding:22px 16px 16px;gap:8px 16px}header h1{font-size:25px}header p{order:3;flex-basis:100%;font-size:12px}header>a{margin-left:auto}main{padding:20px 16px}.intro{padding:18px}.tools input{flex-basis:100%;min-width:0}.layout{grid-template-columns:1fr;gap:12px}.list{max-height:180px}article{padding:24px 20px 34px}article h2{font-size:24px}.source blockquote{font-size:16px}}
/* 考据空间与阅读站共用水墨纸色，证据文字保持高对比。 */
:root{--paper:#f0eee9;--ink:#292b2a;--muted:#737570;--line:#dbd9d1;--red:#a4513f;--panel:#f2f0ea;--card:#fcfbf8}
body{background:var(--paper) url('web/ink-landscape.svg') center top / cover fixed}
body::before{content:'';position:fixed;inset:-40%;z-index:0;pointer-events:none;background:linear-gradient(118deg,transparent 30%,rgba(255,255,251,.70) 43%,rgba(216,204,186,.48) 50%,transparent 64%),radial-gradient(ellipse 26% 22% at 75% 65%,rgba(190,205,197,.48),transparent 75%)}
body>header,body>main{position:relative;z-index:1}
@media(prefers-reduced-motion:no-preference){html[data-motion="full"] body::before{animation:research-light-drift 9s ease-in-out infinite alternate}}@keyframes research-light-drift{from{transform:translate3d(-14%,-4%,0)}to{transform:translate3d(16%,5%,0)}}
header,.intro,.list,article{border-radius:15px;box-shadow:8px 12px 28px rgba(70,91,83,.10),-6px -6px 18px rgba(255,255,255,.65)}
header{margin-top:24px;border:1px solid rgba(255,255,255,.75);padding:20px 24px;background:rgba(251,252,250,.84)}
.intro,.list{background:rgba(251,252,250,.86)}article{background:rgba(253,254,251,.95)}
.warning,.image-evidence,.citation,.source{border-radius:10px;background:rgba(248,249,245,.78);box-shadow:inset 1px 1px 0 rgba(255,255,255,.7),4px 6px 16px rgba(65,65,57,.05)}
.source{padding:12px 16px;border:1px solid var(--line);border-left:2px solid var(--line)}
input,select,button{border-radius:8px}.stamp{border-radius:5px}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){header,.intro,.list{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}}
@media(prefers-color-scheme:dark){:root{--paper:#1a1c1b;--ink:#f0eee7;--muted:#b4b5ad;--line:#474a45;--red:#e4a380;--panel:#30332f;--card:#242725}body{background:radial-gradient(ellipse at 70% 10%,#41433f,transparent 48%),var(--paper)}body::before{background:linear-gradient(118deg,transparent 30%,rgba(226,225,203,.10) 44%,rgba(224,177,143,.13) 51%,transparent 64%)}header,.intro,.list,article{background:var(--card);border-color:var(--line);box-shadow:0 12px 28px rgba(0,0,0,.2)}}
@media(prefers-color-scheme:dark){.warning,.image-evidence,.citation,.source{background:var(--panel);box-shadow:none}}
@media(max-width:760px){header{margin:14px 12px 0;padding:16px}main{padding:16px 12px}.intro{padding:18px}article{padding:24px 20px}}
</style>
<header><h1>考据笺</h1><p>原文有本，判断有据，疑处存疑。</p><label>视觉效果 <select data-motion-setting aria-label="选择视觉效果"><option value="full">完整</option><option value="gentle">柔和</option><option value="still">静态</option></select></label><a href="./">返回文献站</a></header>
<main><p class="intro">这里公开资料核查、版本线索与有据推测。结构检查和机器引文命中均不等于人工学术审校；未审推测不进入已确认事实和默认地图路线。</p>
<div class="tools"><input id="q" type="search" aria-label="检索研究记录" placeholder="按题名、对象或记录号检索"><select id="kind" aria-label="记录类型"><option value="">全部记录</option><option value="audit">资料核查</option><option value="witness">版本见证</option><option value="inference">研究推测</option></select><select id="status" aria-label="核查状态"><option value="">全部状态</option><option value="pending">待核</option><option value="partial">部分核实</option><option value="verified">已核指定事项</option><option value="restricted">来源受限</option></select><span id="count" role="status"></span></div>
<div class="layout"><nav class="list" id="list" aria-label="研究记录"></nav><article id="record" aria-live="polite"><p>请选择一条记录。</p></article></div>
<details id="sources"><summary>来源台账 · 查看提供者、访问状态与使用条件</summary><div id="source-list"></div></details>
<footer>引用应包含记录号与修订号。旧修订保留，新的研究结论不会改写旧引用。</footer></main>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={pending:'待核',partial:'部分核实',verified:'已核指定事项',restricted:'来源受限',rejected:'已否决'};
let records=[], sources=new Map(), requestSeq=0;
const params=new URLSearchParams(location.search);
const safeUrl=s=>{try{const u=new URL(s,location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};
function imageObservations(d){const items=(d.imageObservations||[]).filter(x=>x.status!=='rejected');if(!items.length)return '';return '<h3>影像观察</h3>'+items.map(x=>{
 const preview=safeUrl(x.previewUrl),source=safeUrl(x.sourceUrl),label=(x.origin==='ai'?'AI目读':x.origin==='human'?'影像读文':'生成方式未记录')+'·'+(x.status==='verified'?'已人工审校此项':'未经人工审校');
 return '<section class="image-evidence"><span class="stamp">'+esc(label)+'</span><p class="meta">'+esc(x.fileTitle)+' · 第 '+esc(x.page)+' 图</p><p class="image-reading">'+esc(x.reading)+'</p><p>'+esc(x.method)+'</p><p class="meta">目读文字与电子转录分别保存；本项不代表全卷或版本已核。</p><div class="image-actions">'+(preview?'<a href="'+esc(preview)+'" target="_blank" rel="noopener">查看此图 ↗</a>':'')+(source?'<a href="'+esc(source)+'" target="_blank" rel="noopener">来源修订 ↗</a>':'')+'</div><details><summary>原件与观察记录</summary><pre class="citation">'+esc(JSON.stringify({originalSha256:x.originalSha256,previewSha256:x.previewSha256,metadataRevisionId:x.metadataRevisionId,reviewHistory:x.reviewHistory},null,2))+'</pre></details></section>';
 }).join('')}
async function json(url){const r=await fetch(url);if(!r.ok)throw new Error('读取失败');return r.json()}
async function load(api,file){try{if(location.hostname.endsWith('github.io'))throw new Error('static');return await json(api)}catch{return json(file)}}
function renderList(){const q=$('#q').value.trim().toLowerCase(),kind=$('#kind').value,status=$('#status').value;
 const hits=records.filter(r=>(!params.get('type')||r.subject.type===params.get('type'))&&(!params.get('key')||r.subject.key===params.get('key'))&&(!kind||r.kind===kind)&&(!status||r.status===status)&&(!q||[r.id,r.title,r.subject.key].join(' ').toLowerCase().includes(q)));
 $('#count').textContent=hits.length+' 条';$('#list').innerHTML=hits.length?hits.map(r=>'<button class="item" data-id="'+esc(r.id)+'">'+esc(r.title)+'<small>'+esc(STATUS[r.status])+' · 第 '+r.revision+' 修订</small></button>').join(''):'<p>没有符合条件的公开记录。</p>';
 $('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id+'/'+records.find(r=>r.id===b.dataset.id).revision;if(matchMedia('(max-width:760px)').matches)$('#record').scrollIntoView({block:'start',behavior:'smooth'})});
}
async function openRecord(){const ticket=++requestSeq;const [id,rev]=location.hash.slice(1).split('/');if(!id)return;
 if(!/^[a-z0-9-]+$/.test(id)||!/^\d+$/.test(rev||'')){ $('#record').textContent='引用格式无效。';return }
 try{const d=await load('/api/research/'+id+'/'+rev,'data/research-history/'+id+'/'+rev+'.json');if(ticket!==requestSeq)return;
 if(d.visibility!=='public'||d.status==='rejected')throw new Error('非公开记录');
 const p=d.provenance||{}, ai=['ai','mixed'].includes(p.origin),review=(d.reviewHistory||[]).length>0;
 const label=d.kind==='inference'?(ai?'AI推测·'+(review?'已人工审校':'未经人工审校'):'研究推测·'+(p.origin==='unknown'?'生成方式未记录':'请核对审校记录')):STATUS[d.status];
 const ehtml=(d.evidence||[]).map(e=>{const s=sources.get(e.sourceId),url=safeUrl(e.url||s?.url);return '<div class="source"><blockquote>'+esc(e.quote)+'</blockquote><p>'+esc(e.locator)+' · '+esc(s?.name||e.sourceId)+'</p>'+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener">查看来源 ↗</a>':'')+'<p class="meta">版本：'+esc(e.commit||e.revision||e.edition||'待补')+'<br>SHA-256：'+esc(e.sha256)+'</p></div>'}).join('');
 const citation='江山行止，'+d.title+'，记录 '+d.id+'，修订 '+d.revision+'，更新于 '+d.updatedAt+'。\n'+location.href;
 $('#record').innerHTML='<span class="stamp">'+esc(label)+'</span><h2>'+esc(d.title)+'</h2><p class="meta">'+esc(d.id)+' · 修订 '+d.revision+' · '+esc(d.updatedAt)+'</p><p class="warning">'+esc(d.claim)+'</p>'+(ai?'<p class="meta">模型：'+esc(p.model)+' / '+esc(p.modelVersion)+' · 生成于 '+esc(p.generatedAt)+'</p>':'')+'<h3>核查事项</h3><ul>'+(d.issues||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h3>原文与出处</h3>'+(ehtml||'<p>尚缺可定位的原句；当前记录不构成史实确证。</p>')+imageObservations(d)+(d.reasoning?'<h3>推理过程</h3><p>'+esc(d.reasoning)+'</p>':'')+'<h3>反证与异说</h3><p>'+esc(d.counterEvidence)+'</p><ul>'+(d.alternatives||[]).map(x=>'<li>'+esc(typeof x==='string'?x:JSON.stringify(x))+'</li>').join('')+'</ul><h3>下一步</h3><p>'+esc(d.nextAction||'依据新证据继续复核。')+'</p><details><summary>检索与审校记录</summary><pre class="citation">'+esc(JSON.stringify({searchLog:d.searchLog,reviewHistory:d.reviewHistory},null,2))+'</pre></details><h3>引用此修订</h3><div class="citation" id="citation">'+esc(citation)+'</div><button id="copy">复制引用</button>';
 $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(citation);$('#copy').textContent='已复制'}catch{$('#copy').textContent='请选中上方引用复制'}};
 $('#list').querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));
 }catch{if(ticket===requestSeq)$('#record').innerHTML='<p class="error">未找到该公开修订，或资料暂时不可用。请保留记录号稍后重试。</p>'}}
async function boot(){try{const [idx,src]=await Promise.all([load('/api/research','data/research-index.json'),load('/api/sources','shared/sources.json')]);records=idx.records;sources=new Map(src.sources.map(s=>[s.id,s]));renderList();$('#source-list').innerHTML=src.sources.map(s=>'<div class="source"><b>'+esc(s.name)+'</b><p class="meta">'+esc(s.probe?.status)+' · 下载/入库/分发：'+esc([s.permissions.download,s.permissions.ingest,s.permissions.redistribute].join(' / '))+'</p><p>'+esc(s.usageNote)+'</p>'+(safeUrl(s.url)?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">来源入口 ↗</a>':'')+'</div>').join('');if(!location.hash){const first=$('#list button[data-id]');const record=records.find(r=>r.id===first?.dataset.id);if(record)history.replaceState(null,'','#'+record.id+'/'+record.revision)}await openRecord()}catch{$('#record').textContent='研究索引读取失败，请稍后重试。'}}
$('#q').oninput=renderList;$('#kind').onchange=renderList;$('#status').onchange=renderList;addEventListener('hashchange',openRecord);boot();
</script></html>
